<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>照片立体 · 视差实验台</title>
<style>
  :root {
    --bg: #0E1319;
    --line: rgba(255, 255, 255, 0.12);
    --text: #E8EEF5;
    --sub: rgba(232, 238, 245, 0.45);
    --accent: #9FE3BF;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 560px;
    margin: 0 auto;
    padding: 24px 20px 40px;
  }
  h1 { font-size: 19px; font-weight: 600; margin: 0 0 6px; letter-spacing: .3px; }
  .lede { font-size: 12.5px; line-height: 1.7; color: var(--sub); margin: 0 0 18px; }
  .lede b { color: rgba(232,238,245,.72); font-weight: 500; }

  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 20px;
    overflow: hidden;
    background: #12181F;
    cursor: crosshair;
    touch-action: none;
  }
  .layer {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    will-change: transform;
  }
  .back img, .back .ph {
    width: 122%; height: 122%;
    object-fit: cover;
    opacity: .55;
    display: block;
  }
  .back .ph {
    background: radial-gradient(60% 60% at 50% 45%, #24303C 0%, #12181F 100%);
    opacity: 1;
  }

  .card, .cut {
    object-fit: cover;
    display: none;
  }
  .card {
    width: 72%; height: 72%;
    border-radius: 22px;
    box-shadow: 0 14px 34px rgba(0, 0, 0, .55);
  }
  .cut {
    width: 80%; height: 80%;
    object-fit: contain;
  }
  .emoji {
    font-size: 132px; line-height: 1;
    filter: drop-shadow(0 12px 20px rgba(0, 0, 0, .5));
  }
  .ground {
    position: absolute;
    bottom: 11%;
    left: 50%;
    width: 46%;
    height: 26px;
    margin-left: -23%;
    border-radius: 50%;
    background: radial-gradient(50% 50% at 50% 50%, rgba(0, 0, 0, .5) 0%, rgba(0, 0, 0, 0) 72%);
  }
  .front {
    pointer-events: none;
    background:
      radial-gradient(28% 22% at 76% 24%, rgba(255, 238, 205, .16) 0%, rgba(255, 238, 205, 0) 70%),
      linear-gradient(126deg, rgba(210, 232, 255, 0) 38%, rgba(210, 232, 255, .1) 50%, rgba(210, 232, 255, 0) 62%);
  }
  .vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(72% 72% at 50% 46%, rgba(0, 0, 0, 0) 52%, rgba(0, 0, 0, .42) 100%);
  }

  .readout {
    margin-top: 14px;
    padding: 10px 14px;
    border-radius: 10px;
    background: rgba(255, 255, 255, .04);
    font-size: 12px;
    color: rgba(232, 238, 245, .55);
    font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum";
  }

  .row { display: flex; align-items: center; margin-top: 12px; gap: 8px; }
  .label { width: 52px; font-size: 12.5px; color: var(--sub); flex: none; }
  .seg {
    flex: 1;
    border-radius: 9px;
    background: rgba(255, 255, 255, .06);
    text-align: center;
    padding: 9px 0;
    font-size: 12.5px;
    color: rgba(232, 238, 245, .6);
    cursor: pointer;
    user-select: none;
    transition: background .15s, color .15s;
  }
  .seg.on { background: rgba(120, 200, 160, .22); color: var(--accent); font-weight: 500; }
  .seg:hover { background: rgba(255, 255, 255, .1); }
  .seg.on:hover { background: rgba(120, 200, 160, .28); }

  .hint {
    margin-top: 18px;
    font-size: 11.5px;
    line-height: 1.75;
    color: rgba(232, 238, 245, .32);
  }
  code { color: rgba(232, 238, 245, .5); font-size: 11px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>照片立体 · 视差实验台</h1>
  <p class="lede">
    这套算法和小程序 <b>utils/parallax.js</b> 是同一份代码（构建时直接内联，不是抄一遍），
    调好的参数就是小程序里跑的参数。<b>把一张宠物照拖进画面</b>，左右移动鼠标看厚度感够不够。
  </p>

  <div class="stage" id="stage">
    <div class="layer back" id="back">
      <img id="bgImg" alt="" hidden />
      <div class="ph" id="bgPh"></div>
    </div>
    <div class="layer" id="mid">
      <img class="card" id="cardImg" alt="" />
      <img class="cut" id="cutImg" alt="" />
      <div class="emoji" id="emoji">🐶</div>
      <div class="ground"></div>
    </div>
    <div class="layer front" id="front"></div>
    <div class="vignette"></div>
  </div>

  <div class="readout" id="readout">把鼠标移到画面上左右移动（手机上直接倾斜）</div>

  <div class="row">
    <span class="label">模式</span>
    <div class="seg on" data-mode="card">卡片</div>
    <div class="seg" data-mode="cutout">抠图示意</div>
  </div>
  <div class="row">
    <span class="label">景深</span>
    <div class="seg" data-strength="12">12</div>
    <div class="seg on" data-strength="18">18</div>
    <div class="seg" data-strength="26">26</div>
  </div>
  <div class="row">
    <span class="label">动效</span>
    <div class="seg on" id="autoBtn">自动摆动</div>
    <div class="seg" id="pickBtn">换一张照片</div>
  </div>
  <input type="file" id="file" accept="image/*" hidden />

  <p class="hint">
    「卡片」是没有抠图时的退路：模糊背景 + 照片卡 + 高光三层错位。<br />
    「抠图示意」只是把主体放大、去掉圆角和阴影来模拟透明前景，
    <b>真抠图</b>要接分割接口，走云函数中转，密钥不进客户端。<br />
    小程序里的同一页：<code>pages/pet-3d/pet-3d</code>
  </p>
</div>

<script>
/*__PARALLAX__*/
</script>
<script>
(function () {
  var stage = document.getElementById('stage');
  var readout = document.getElementById('readout');
  var bgImg = document.getElementById('bgImg');
  var bgPh = document.getElementById('bgPh');
  var cardImg = document.getElementById('cardImg');
  var cutImg = document.getElementById('cutImg');
  var emoji = document.getElementById('emoji');
  var file = document.getElementById('file');

  var state = {
    mode: 'card',
    strength: 18,
    auto: true,
    photo: ''
  };

  // 初始就给一点倾角：第一眼就能看出三层错开，而不是等用户先动鼠标
  var cur = { ux: 0.34, uy: -0.18 };
  var target = { ux: 0.34, uy: -0.18 };
  var pointerAt = 0;

  function preset() { return PX.PRESETS[state.mode] || PX.PRESETS.card; }

  function applyStyle() {
    var p = preset();
    bgImg.style.filter = 'blur(' + p.blur + 'px)';
    bgImg.style.transform = 'scale(' + p.scaleBack + ')';
    bgPh.style.filter = 'blur(' + p.blur + 'px)';
    bgPh.style.transform = 'scale(' + p.scaleBack + ')';

    var isCut = state.mode === 'cutout' && state.photo;
    cardImg.style.display = state.photo && !isCut ? 'block' : 'none';
    cutImg.style.display = isCut ? 'block' : 'none';
    emoji.style.display = state.photo ? 'none' : 'block';
    bgImg.style.display = state.photo ? 'block' : 'none';
    bgPh.style.display = state.photo ? 'none' : 'block';
  }

  function setPhoto(url) {
    state.photo = url;
    bgImg.src = url;
    cardImg.src = url;
    cutImg.src = url;
    applyStyle();
  }

  function setMode(mode) {
    state.mode = mode;
    document.querySelectorAll('[data-mode]').forEach(function (el) {
      el.classList.toggle('on', el.dataset.mode === mode);
    });
    applyStyle();
  }

  function setStrength(v) {
    state.strength = v;
    document.querySelectorAll('[data-strength]').forEach(function (el) {
      el.classList.toggle('on', Number(el.dataset.strength) === v);
    });
  }

  document.querySelectorAll('[data-mode]').forEach(function (el) {
    el.addEventListener('click', function () { setMode(el.dataset.mode); });
  });
  document.querySelectorAll('[data-strength]').forEach(function (el) {
    el.addEventListener('click', function () { setStrength(Number(el.dataset.strength)); });
  });
  document.getElementById('autoBtn').addEventListener('click', function () {
    state.auto = !state.auto;
    this.classList.toggle('on', state.auto);
  });
  document.getElementById('pickBtn').addEventListener('click', function () { file.click(); });
  file.addEventListener('change', function () {
    var f = file.files && file.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function () { setPhoto(fr.result); };
    fr.readAsDataURL(f);
  });

  // 拖放：直接把照片拖进画面
  stage.addEventListener('dragover', function (e) { e.preventDefault(); });
  stage.addEventListener('drop', function (e) {
    e.preventDefault();
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function () { setPhoto(fr.result); };
    fr.readAsDataURL(f);
  });

  // 鼠标 / 触摸：相对画面中心的位置当倾斜量
  function pointerMove(clientX, clientY) {
    var r = stage.getBoundingClientRect();
    var ux = ((clientX - r.left) / r.width - 0.5) * 2;
    var uy = ((clientY - r.top) / r.height - 0.5) * 2;
    target.ux = PX.clamp(ux, -1, 1);
    target.uy = PX.clamp(uy, -1, 1);
    pointerAt = performance.now();
  }

  stage.addEventListener('mousemove', function (e) { pointerMove(e.clientX, e.clientY); });
  stage.addEventListener('mouseleave', function () { target.ux = 0; target.uy = 0; });
  stage.addEventListener('touchmove', function (e) {
    if (!e.touches[0]) return;
    pointerMove(e.touches[0].clientX, e.touches[0].clientY);
    e.preventDefault();
  }, { passive: false });

  // 真机倾斜（浏览器里 deviceorientation 和浏览器坐标系一致，直接用）
  window.addEventListener('deviceorientation', function (e) {
    if (e.gamma == null || e.beta == null) return;
    var u = PX.tiltUnit(e.gamma, e.beta, { x: 0, y: 40 });
    target.ux = u.ux;
    target.uy = u.uy;
    pointerAt = performance.now();
  });

  setPhoto('');
  applyStyle();

  function frame() {
    // 用 performance.now() 而不是 rAF 回调的时间戳：
    // 时间戳在某些环境下可能不推进（比如无头浏览器冻结合成时），
    // 自己取时间更稳，动画不会莫名停住
    var t = performance.now();
    // 没人操作就自己慢慢摆，方便第一眼看懂效果
    if (state.auto && t - pointerAt > 1400) {
      target.ux = Math.sin(t / 1600) * 0.55;
      target.uy = Math.cos(t / 2100) * 0.3;
    }
    cur = PX.smoothUnit(cur, target, 0.14);
    var off = PX.offsets(cur, preset(), state.strength);

    document.getElementById('back').style.transform =
      'translate3d(' + off.back.x + 'px,' + off.back.y + 'px,0)';
    document.getElementById('mid').style.transform =
      'translate3d(' + off.mid.x + 'px,' + off.mid.y + 'px,0)';
    document.getElementById('front').style.transform =
      'translate3d(' + off.front.x + 'px,' + off.front.y + 'px,0)';

    readout.textContent = '倾斜 x ' + (Math.round(cur.ux * 100) / 100)
      + ' · y ' + (Math.round(cur.uy * 100) / 100)
      + '　三层位移 后 ' + Math.round(off.back.x) + ' / 中 ' + Math.round(off.mid.x)
      + ' / 前 ' + Math.round(off.front.x) + ' px';

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
